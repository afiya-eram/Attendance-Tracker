<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
               
        .box {
            height: 250px;
            width: 400px;
            /* margin:auto; */
            /* background-color: antiquewhite; */
            border: solid rgb(110, 108, 108);
            margin-top: 70px;
            border-radius: 10px;
            padding: 10px;
        }

        .box2 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
            margin: 10px;


        }

        #I {
            /* margin:3px; */
            width: 390px;
            height: 30px;
            border-radius: 5px;
        }

        button {
            width: 390px;
            height: 45px;
             background-color: #C9B3DF;
            border-radius: 5px;
            margin-top: 7px;

        }
    </style>
</head>

<body>
    <div class="box">
        <div class="box2">
            <h1>AttendEase</h1>
            <p>Your Personal Attendance manager</p>
        </div>
        <p><b>User ID</b></p>
        <input id="I" type="search" placeholder="Enter Your Name">
        </br>
        <button id="btn">Login</button>
        <script>
            let btn = document.getElementById("btn");
            btn.addEventListener("click", function () {
                let input = document.getElementById("I").value;
                if (input == "") {
                    alert("Please Enter Your Name");
                }
                else {
                    localStorage.setItem("name", input);
                    localStorage.setItem("currentUser", input.trim().toLowerCase());
                    window.location.href = "home2.html";
                }
            })
        </script>
    </div>
</body>

</html>
